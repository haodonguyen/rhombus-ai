# Local development stack: `docker compose up --build`
# Values below are dev defaults; override any of them in a `.env` file (see .env.example).
name: rhombus

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  DATABASE_URL: ${DATABASE_URL:-postgres://app:app@postgres:5432/app}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-datasets}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  RESULTS_PATH: /data/results
  SPARK_MASTER: ${SPARK_MASTER:-local[*]}
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
  SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
  SPARK_MAX_PARTITION_BYTES: ${SPARK_MAX_PARTITION_BYTES:-16m}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:3b}
  LLM_CACHE_TTL: ${LLM_CACHE_TTL:-604800}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub no longer publishes MinIO images; the pinned Quay release is used for dev only.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-seed:
    build:
      context: ./backend
      target: web
    command: python /scripts/seed_bucket.py
    environment: *backend-env
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  ollama:
    # Local LLM server for natural-language patterns; no API key needed.
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    # One-shot: download the model into the shared volume (skipped quickly once cached).
    image: ollama/ollama:0.34.0
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5-coder:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./backend
      target: web
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload"
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - results:/data/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      target: worker
    environment: *backend-env
    volumes:
      - ./backend:/app
      - results:/data/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  flower:
    build:
      context: ./backend
      target: web
    command: celery -A config flower --port=5555
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:admin}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  results:
  ollama-data:
